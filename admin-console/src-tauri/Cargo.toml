[package]
name = "graffiti_admin"
version = "1.0.0"
description = "Graffiti feedback administration console"
authors = ["Klaav"]
edition = "2021"

[lib]
name = "graffiti_admin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
