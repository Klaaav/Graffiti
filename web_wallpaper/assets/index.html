<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Wallpaper</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: transparent;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "./three.module.js",
                "../utils/BufferGeometryUtils.js": "./BufferGeometryUtils.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from './GLTFLoader.js';

        let isPaused = false;
        let lastX = 0, lastY = 0;

        // ---- Three.js setup ----
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 3;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
        directionalLight.position.set(0, 0, 1); // point from camera
        camera.add(directionalLight);
        scene.add(camera);

        let model = null;
        let targetRotationX = 0;
        let targetRotationY = 0;
        
        let configRotationFactor = 0.2;
        let configZoomFactor = 1.0;
        let configOffsetX = 0.0;
        let configOffsetY = 0.0;
        let configEnableVerticalRotation = true;
        let configInitialRotationX = 0.0;
        let configInitialRotationY = 0.0;

        function disposeObject(obj) {
            obj.traverse(child => {
                if (child.geometry) child.geometry.dispose();
                if (child.material) {
                    const materials = Array.isArray(child.material) ? child.material : [child.material];
                    materials.forEach(m => {
                        if (m.map) m.map.dispose();
                        if (m.normalMap) m.normalMap.dispose();
                        if (m.roughnessMap) m.roughnessMap.dispose();
                        if (m.metalnessMap) m.metalnessMap.dispose();
                        m.dispose();
                    });
                }
            });
        }

        function loadModel(url) {
            if (model) {
                scene.remove(model);
                disposeObject(model);
                model = null;
            }
            if (!url) return;

            const loader = new GLTFLoader();
            console.log("[WebWallpaper] Attempting to load model path:", `./${url}`);
            
            loader.load(`./${url}`, (gltf) => {
                console.log("[WebWallpaper] Successfully loaded model:", url);
                model = gltf.scene;
                
                // Position camera to fit model
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3()).length();
                const center = box.getCenter(new THREE.Vector3());
                
                console.log(`[WebWallpaper] Model Size: ${size}, Center: ${center.x}, ${center.y}, ${center.z}`);

                // Dynamically adjust clipping planes to accommodate extremely large or small models
                camera.near = size / 100;
                camera.far = size * 100;
                camera.updateProjectionMatrix();

                const target = center.clone();
                const xOffset = configOffsetX * size * 0.5;
                const yOffset = configOffsetY * size * 0.5;

                camera.position.copy(center);
                camera.position.x -= xOffset;
                camera.position.y -= yOffset;
                camera.position.z += size * (1.0 / configZoomFactor); 
                
                target.x -= xOffset;
                target.y -= yOffset;
                camera.lookAt(target);

                model.rotation.x = configInitialRotationX;
                model.rotation.y = configInitialRotationY;
                targetRotationX = configInitialRotationX;
                targetRotationY = configInitialRotationY;

                scene.add(model);
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage("READY");
                }
            }, undefined, (error) => {
                console.error("[WebWallpaper] GLTFLoader ERROR loading", url, ":", error);
                // Secondary fetch to check exact HTTP status code
                fetch(`./${url}`).then(res => {
                    console.error("[WebWallpaper] HTTP Status for", url, "was:", res.status, res.statusText);
                }).catch(err => {
                    console.error("[WebWallpaper] Fetch API also failed:", err);
                });
                
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage("READY");
                }
            });
        }

        // ---- IPC from C++ host ----
        if (window.chrome && window.chrome.webview) {
            console.log("[WebWallpaper] Registering message listener...");
            window.chrome.webview.addEventListener('message', event => {
                console.log("[WebWallpaper] Message received:", event.data);
                let d = event.data;
                if (typeof d === 'string') {
                    try { d = JSON.parse(d); } catch (e) { return; }
                }

                if (d && d.type === 'config') {
                    if (scene.background && scene.background.isTexture) {
                        scene.background.dispose();
                    }
                    if (d.backgroundType === 'color' && d.backgroundColor) {
                        scene.background = new THREE.Color(d.backgroundColor);
                    } else if (d.backgroundType === 'image' && d.backgroundImage) {
                        const texLoader = new THREE.TextureLoader();
                        texLoader.load(`./${d.backgroundImage}`, (tex) => {
                            if (scene.background && scene.background.isTexture) {
                                scene.background.dispose();
                            }
                            tex.colorSpace = THREE.SRGBColorSpace;
                            scene.background = tex;
                        });
                    }
                    if (d.rotationFactor !== undefined) configRotationFactor = d.rotationFactor;
                    if (d.zoomFactor !== undefined) configZoomFactor = d.zoomFactor;
                    if (d.offsetX !== undefined) configOffsetX = d.offsetX;
                    if (d.offsetY !== undefined) configOffsetY = d.offsetY;
                    if (d.enableVerticalRotation !== undefined) configEnableVerticalRotation = d.enableVerticalRotation;
                    if (d.initialRotationX !== undefined) configInitialRotationX = d.initialRotationX;
                    if (d.initialRotationY !== undefined) configInitialRotationY = d.initialRotationY;

                    if (d.model) {
                        loadModel(d.model);
                    } else {
                        if (window.chrome && window.chrome.webview) {
                            window.chrome.webview.postMessage("READY");
                        }
                    }
                }
                else if (d && d.type === 'mousemove') {
                    lastX = d.x;
                    lastY = d.y;
                    targetRotationY = (d.x * Math.PI * configRotationFactor) + configInitialRotationY;
                    if (configEnableVerticalRotation) {
                        targetRotationX = (d.y * Math.PI * configRotationFactor) + configInitialRotationX;
                    } else {
                        targetRotationX = configInitialRotationX;
                    }
                }
                else if (d && d.type === 'power') {
                    if (d.action === 'pause') isPaused = true;
                    if (d.action === 'resume') isPaused = false;
                }
            });
            console.log("[WebWallpaper] Requesting config...");
            window.chrome.webview.postMessage("REQUEST_CONFIG");
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            if (isPaused) return;

            if (model) {
                model.rotation.y += (targetRotationY - model.rotation.y) * 0.1;
                model.rotation.x += (targetRotationX - model.rotation.x) * 0.1;
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
